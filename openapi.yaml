openapi: 3.1.0
info:
  title: Neobank onboarding — KYC
  version: "1.3.0"
  description: |
    Contract for the two webhooks in `workflow.n8n.json`. Paths match the
    workflow exactly (n8n serves them under `/webhook`).

    **Idempotency.** `POST /onboarding/applications` is idempotent on
    `Idempotency-Key`. The key must be derived from the business event
    (customer + product), never from the attempt. Replaying with the same key
    returns the existing application and does not restart the process.
    Replaying the same key with a *different* body returns 409 — silently
    returning the original would hide a client bug, or an attempt to swap the
    applicant behind a key that is already known.

    **The decision is asynchronous.** A successful submit returns
    `in_progress`; the provider decides later and calls
    `/onboarding/kyc-callback`. A timeout on the provider call leads to
    reconciliation — never to a decline.

    **Public status only.** Responses never carry internal compliance states
    (telling an applicant they are in sanctions review is tipping-off):
    `received | in_progress | approved | declined | expired`.

servers:
  - url: http://localhost:5678/webhook
    description: n8n, as in the Postman collection

paths:
  /onboarding/applications:
    post:
      summary: Submit an onboarding application (idempotent)
      operationId: submitApplication
      security:
        - ClientApiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
          description: >
            Omit it and the server derives sha256(customer_external_ref:product_code),
            so a client that forgets the header still cannot create duplicates.
            A rejected applicant reapplying is a new business event and needs a new key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationRequest' }
      responses:
        '201':
          description: >
            Application created and processed as far as it synchronously can.
            `status` is `in_progress` while screening, KYC or review is running,
            or `declined` when the applicant is ineligible (under 18,
            unsupported country). The reason is not disclosed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationResponse' }
        '200':
          description: Idempotent replay — the existing application, current state, process not restarted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationResponse' }
        '400':
          description: Malformed request. Nothing is stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: validation_failed }
                  problems: { type: array, items: { type: string } }
        '401':
          description: Missing or wrong client API key
        '409':
          description: >
            `idempotency_key_reuse_with_different_payload` — same key, different body.
            `application_already_open` — this customer already has a live application
            for this product under another key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [idempotency_key_reuse_with_different_payload, application_already_open]
                  application_id: { type: string, format: uuid }

  /onboarding/kyc-callback:
    post:
      summary: Asynchronous KYC decision from the provider
      operationId: kycCallback
      description: |
        Signed with HMAC-SHA256 over `{timestamp}.{raw body}`. The signature is
        verified against the **raw** bytes before parsing, with a constant-time
        compare and a ±300 s timestamp tolerance.

        Delivery is at-least-once and may arrive out of order: `event_id` is the
        dedupe key and the transition key, so an event is applied at most once.
        A callback that would move an already-decided application is refused by
        the transition table and acknowledged with 200 — there is nothing for
        the provider to retry. `sequence` is recorded for audit only.
      parameters:
        - name: X-Provider-Signature
          in: header
          required: true
          schema: { type: string, description: hex HMAC-SHA256 }
        - name: X-Provider-Timestamp
          in: header
          required: true
          schema: { type: string, description: Unix seconds }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KycCallback' }
      responses:
        '200':
          description: Accepted — applied, duplicate, lifecycle event, unknown reference, or stale (no state change)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        '401':
          description: Signature invalid, missing, outside tolerance, or the body is unusable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  reason:
                    type: string
                    enum: [server_misconfigured_no_secret, missing_signature_headers, raw_body_unavailable,
                           timestamp_outside_tolerance, bad_signature, unparseable_body, incomplete_event]

components:
  securitySchemes:
    ClientApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  schemas:
    PublicStatus:
      type: string
      enum: [received, in_progress, approved, declined, expired]
      description: >
        Deliberately coarse. Internal states (screening, kyc_pending,
        kyc_unknown, kyc_review…) all map to in_progress.

    ApplicationRequest:
      type: object
      required: [customer_external_ref, product_code, applicant]
      properties:
        customer_external_ref: { type: string, example: CUST-88213 }
        product_code: { type: string, example: CURRENT_ACCOUNT_EUR }
        applicant:
          type: object
          required: [given_name, family_name, date_of_birth, country]
          properties:
            given_name:    { type: string, example: Jonas }
            family_name:   { type: string, example: Petraitis }
            date_of_birth: { type: string, format: date, example: "1991-04-17" }
            country:       { type: string, pattern: '^[A-Z]{2}$', example: LT }

    ApplicationResponse:
      type: object
      properties:
        application_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PublicStatus' }

    KycCallback:
      type: object
      required: [event_id]
      properties:
        event_id:         { type: string, description: Dedupe and transition key. }
        check_id:         { type: string, description: The provider's id for the check. }
        client_reference: { type: string, example: '3f0c…-…:1', description: 'Echo of what we sent: "<application id>:<kyc round>". A decision for an earlier round is acknowledged and ignored.' }
        sequence:         { type: integer, description: Recorded for audit only. }
        event_type:       { type: string, description: 'Lifecycle events (e.g. check.started) are recorded and acknowledged; they never move state.' }
        decision:
          type: string
          enum: [CLEAR, REFER, DECLINE]
          description: >
            CLEAR → approved · DECLINE → rejected · REFER → kyc_review. Absent or
            unrecognised → recorded, no state change. No provider value maps to an
            automatic reject on a technical failure — that is the point.
